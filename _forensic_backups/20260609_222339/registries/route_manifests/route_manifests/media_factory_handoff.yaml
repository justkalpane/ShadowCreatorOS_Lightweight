  media_creation_allowed_after_approval: false
  local_engine_execution_allowed_after_approval: true
  local_engine_evidence_required_when_execution_claimed: true

# Permanent Local Bridge
local_media_factory_bridge:
  bridge_registry: registries/local_media_factory_bridge.yaml
  bridge_contract: runtime_contracts/LOCAL_MEDIA_FACTORY_BRIDGE_CONTRACT.md
  bridge_sync_tool: tools/shadow_runtime/media_factory_bridge_sync.py
  local_media_factory_root: /Users/apple/ShadowMediaFactory
  control_panel_cli: /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py
  capability_map: /Users/apple/ShadowMediaFactory/control_panel/config/capability_map.json
  sync_audit_command: "python3 tools/shadow_runtime/media_factory_bridge_sync.py --runtime-check"
  sync_apply_command: "python3 tools/shadow_runtime/media_factory_bridge_sync.py --runtime-check --apply"
  preflight_required_before_render: true
  production_pass_blocked_on_route_downgrade: true
  drift_sync_required_after_media_factory_change: true
  safe_to_batch_automate_cinematic_broll: false

# Status Limits
status_limits:
  full_pass_requires_validator_binding: true
  full_pass_requires_provider_boundary: true
  full_pass_requires_scene_row_json_per_scene: true
  full_pass_requires_visual_dna_all_fields: true
  full_pass_requires_production_control_layer: true
  documented_only_max_status: PARTIAL
  claimed_artifact_without_evidence_max_status: BLOCKED

# Onboarding Limits
onboarding_limits:
  safe_to_start_n8n: false
  safe_to_declare_lightweight_os_onboarded: false
  safe_to_claim_provider_execution: false
  safe_to_claim_local_engine_execution_without_evidence: false

