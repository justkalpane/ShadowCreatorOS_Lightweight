visual_method_assignment_law:
  NOTEBOOKLM_VISUAL_METHOD: HyperFrames CLI through SS-116 and SS-118
  PROGRAMMATIC_SLIDE_VISUAL_METHOD: HyperFrames CLI through SS-118
  HTML_CSS_GSAP_VISUAL_METHOD: HyperFrames CLI through SS-118
  A_ROLL_OVERLAY_METHOD: HeyGen chromakey foreground plus HyperFrames background/alpha overlay composited in DaVinci Resolve
  IMAGE_MOTION_GRAPHICS_BROLL_METHOD: still image plus Depth Anything V2 mask plus DaVinci Resolve Fusion parallax through SS-117
  CINEMATIC_BROLL_VIDEO: approved cloud/premium cinematic video lane unless a future local proof upgrades local cinematic B-roll
  A_ROLL_AVATAR: HeyGen or approved avatar provider
  final_assembly: DaVinci Resolve, with FFmpeg as assembly/export guard
b_roll_minimum_percentage: 12
locked_storyboard_format: multi_arc_table_10_columns_plus_reasoning
locked_scene_breakout_format: one_scene_per_vertical_table_with_scene_heading
locked_rehook_default: four_rehooks_at_max_90_second_intervals_for_5_minute_plan
fail_rules: [scene prompt packet missing visual DNA field, SCENE_SYNC_MATRIX missing or contains only headings, media artifact claimed without evidence block, provider execution claimed without approval, local engine execution claimed without render metadata, tool_specific_translation_readiness below PACKET_READY for claimed execution]
partial_rules: [local engine readiness is DESIGNED or STUB but disclosed, storyboard export plan present but images not yet generated, pacing metadata present but video not yet rendered]
pass_rules: [SCENE_SYNC_MATRIX emits one scene_row_json per scene, SCENE_BREAKOUT_BLOCKS preserve one scene per readable vertical breakout table, visual media plan creates no files/folders without explicit repo-write approval, visual media plan is not forced to include generator bundle or scene execution blocks, media factory final draft includes complete 15-field visual DNA prompt packets when that depth is requested, visual media generator draft includes MISSION_MEDIA_OUTPUT_BUNDLE and SCENE_EXECUTION_BLOCKS when that depth is requested, visual media generator draft includes VOICE_BATCH_PLAN A_ROLL_BATCH_PLAN MUSIC_SFX_BATCH_PLAN IMAGE_BATCH_PLAN CINEMATIC_BROLL_BATCH_PLAN MOTION_GRAPHICS_BATCH_PLAN and ASSEMBLY_SYNC_PLAN, PRODUCTION_ORDER_LOCK freezes dependency-safe generation order, PRODUCTION_ORDER_LOCK includes exact ordered production_phase_row_json rows, ASSET_DEPENDENCY_GRAPH maps every asset to dependencies and proof requirements, CONTROL_PANEL_EXECUTION_PLAN names preflight and job packet paths, CONTROL_PANEL_EXECUTION_PLAN includes control_panel_phase_row_json rows, DAVINCI_TIMELINE_PACKET maps V1/V2/V3 and A1-A5 tracks, LOCAL_MEDIA_FACTORY_BRIDGE_STATUS declares readiness per engine per lane when executable/final draft depth is requested, PRODUCTION_PROOF_GATE blocks completion without artifact proof, PROVIDER_HONESTY_GATE is explicit with no fake claims, storyboard export references exact filenames in pacing metadata when storyboard export depth is requested, RULE_CONSUMPTION_EVIDENCE_LEDGER present, EXACT_RULE_LINEAGE_MAP present, mandatory route actors individually opened before output]
