script_story_engine:
  cinematic_story_required_for: 3_to_10_minute_youtube_scripts
  cinematic_story_required: true
  story_duration_target: 45_to_75_seconds
  story_type: real_character_or_real_incident_driven
  realistic_composite_allowed_when_honestly_labeled: true
  mythological_parallel_allowed_when_honestly_labeled: true
  named_public_figure_defaults_to_real_person_public_arc: true
  story_must_resemble_topic: true
  story_position_default: after_hook_before_main_teaching
  required_fields: [character, setting, conflict, turning_point, cinematic_visuals, emotional_peak, lesson_bridge, source_references, unsupported_claims, status]
  source_dependency_required_when: [real_person, real_incident, biographical_claim, career_claim]
  story_gate_must_fail_if_missing: true

real_world_source_gate:
  web_required_when: [real_person, celebrity, brand, tool, platform, model, company, current_trend, law, pricing, factual_claim, case_study, article_reference, video_reference, biographical_claim, career_claim, real_world_example_as_proof]
  required_fields: [freshness_class, current_data_required, web_access_available, web_access_used, research_mode, source_list, video_reference_list, unsupported_claims, current_fact_confidence, research_sufficiency_gate_status]
  unsupported_claims_prevent_pass: true
  web_required_but_unused_prevents_pass_unless_user_approved_repo_only: true
  real_time_sources_require_source_list: true
  source_sufficiency_required: true
  minimum_total_sources_when_available: 3
  minimum_non_encyclopedia_sources_when_available: 2
  minimum_source_categories_when_available: 3
  fact_vs_anecdote_map_required: true
  source_to_script_alignment_required: true
  unsupported_absolute_claims_must_be_downgraded: true
  off_topic_current_promo_requires_explicit_user_request: true

script_language_control:
  language_control_contract_required: true
  default_master_script_language: English
  explicit_language_request_required_for_non_english: true
  translation_localization_is_separate_stage: true
  language_inference_from_topic_or_culture_forbidden: true

dynamic_timed_beat_map:
  dynamic_timed_beat_map_required: true
  allowed_block_duration_seconds: 3_to_20
  block_duration_reason_required: true
  uniform_15_second_grid_requires_justification: true

