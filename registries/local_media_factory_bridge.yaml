version: 1
registry_id: local_media_factory_bridge
updated_at: "2026-06-21"
owner: shadow_commander
purpose: >
  Permanent local bridge registry between ShadowCreatorOS_Lightweight and the
  deployed ShadowMediaFactory engine on the current Mac. Agents must use this
  registry before handing off visual drafts, storyboard packets, prompt packets,
  or render instructions to the local Media Factory.

path_authority:
  note: "Absolute paths are local Mac references, not portable repo law."
  shadow_creator_os_root: /Users/apple/Documents/ShadowCreatorOS_Lightweight
  local_media_factory_root: /Users/apple/ShadowMediaFactory
  local_mac_reference_only: true

runtime_paths:
  media_factory_root: /Users/apple/ShadowMediaFactory
  control_panel_root: /Users/apple/ShadowMediaFactory/control_panel
  control_panel_cli: /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py
  capability_map: /Users/apple/ShadowMediaFactory/control_panel/config/capability_map.json
  proofs_dir: /Users/apple/ShadowMediaFactory/control_panel/proofs
  registry_dir: /Users/apple/ShadowMediaFactory/control_panel/registry
  jobs_dir: /Users/apple/ShadowMediaFactory/control_panel/jobs
  logs_dir: /Users/apple/ShadowMediaFactory/control_panel/logs
  exports_dir: /Users/apple/ShadowMediaFactory/08_EXPORTS
  review_exports_dir: /Users/apple/ShadowMediaFactory/08_EXPORTS/review
  repo_outputs_dir: /Users/apple/ShadowMediaFactory/01_REPO_OUTPUTS
  inbox_dir: /Users/apple/ShadowMediaFactory/00_INBOX
  comfyui_root: /Users/apple/ShadowMediaFactory/apps/ComfyUI
  comfyui_input_dir: /Users/apple/ShadowMediaFactory/apps/ComfyUI/input
  comfyui_output_dir: /Users/apple/ShadowMediaFactory/apps/ComfyUI/output
  comfyui_api_url: http://127.0.0.1:8188
  default_storyboard_input_dir: /Users/apple/Downloads/b_roll_storyboard

handoff_contract:
  shadow_creator_os_role:
    - "Acts as the brain: research, script, scene plan, visual draft, prompt packet, and route decision."
    - "Writes media-aware packets only after the MEDIA_FACTORY_HANDOFF route is selected."
    - "Does not claim generated media unless the Media Factory returns proof artifacts."
  shadow_media_factory_role:
    - "Acts as the local media worker: preflight, local generation, assembly, proofs, registry, export."
    - "Executes only after explicit local-engine approval when execution is requested."
    - "Returns proof JSON and artifact paths back to the ShadowCreatorOS agent."
  job_packet_dir_template: /Users/apple/ShadowMediaFactory/control_panel/jobs/<job_id>/01_timeline
  expected_shadow_os_outputs:
    - prompt_packet.json
    - shotlist.json
    - scene_contract.json
    - video_pacing_metadata.json
    - video_pacing_metadata_notepad.txt
  media_factory_reads_from:
    - /Users/apple/ShadowMediaFactory/control_panel/jobs/<job_id>/01_timeline
    - /Users/apple/Downloads/b_roll_storyboard
    - /Users/apple/ShadowMediaFactory/00_INBOX
  media_factory_writes_to:
    - /Users/apple/ShadowMediaFactory/control_panel/proofs
    - /Users/apple/ShadowMediaFactory/control_panel/registry
    - /Users/apple/ShadowMediaFactory/08_EXPORTS
  shadow_os_runtime_bindings:
    required_runtime_state_schemas:
      - schemas/runtime_state/evidence_bundle.schema.json
      - schemas/runtime_state/route_state_capsule.schema.json
      - schemas/governance/patch_transaction.schema.json
    required_media_factory_packet_schemas:
      - schemas/media_factory/bridge_job_packet.schema.json
      - schemas/media_factory/final_visual_media_generation_draft.schema.json
      - schemas/media_factory/depth_map_packet.schema.json
      - schemas/media_factory/ffmpeg_filtergraph_packet.schema.json
      - schemas/media_factory/hyperframes_payload.schema.json
      - schemas/media_factory/comfyui_workflow_payload.schema.json
      - schemas/media_factory/source_vs_render_packet.schema.json
      - schemas/media_factory/visual_qa_acceptance_packet.schema.json
      - schemas/media_factory/pilot_cut_validation_packet.schema.json
      - schemas/governance/audio_authorization_packet.schema.json
      - schemas/governance/davinci_handoff_packet.schema.json
    required_validators:
      - validators/validate_evidence_bundle.py
      - validators/validate_route_state_capsule.py
      - validators/validate_patch_transaction.py
      - validators/validate_bridge_job_packet.py
      - validators/validate_final_visual_media_generation_draft.py
      - validators/validate_depth_map_packet.py
      - validators/validate_ffmpeg_filtergraph_packet.py
      - validators/validate_hyperframes_payload.py
      - validators/validate_comfyui_payload.py
      - validators/validate_source_vs_render_packet.py
      - validators/validate_visual_qa_acceptance.py
      - validators/validate_pilot_cut_validation_packet.py
      - validators/validate_audio_authorization_packet.py
      - validators/validate_davinci_handoff_packet.py
    blocked_unlocks_until_validated:
      - local_engine_execution_claim
      - full_render_unlock
      - audio_unlock
      - provider_unlock
      - davinci_unlock

control_panel_commands:
  status: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py status"
  doctor: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py doctor"
  preflight_storyboard: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py preflight-storyboard --metadata <metadata_json>"
  local_broll_proof: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-local-broll-proof --profile youtube_16_9"
  run_hyperframes: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-hyperframes --project-root <project> --output <mp4_or_mov>"
  run_depth_anything: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-depth-anything --input <image_or_dir> --output-dir <depth_output_dir>"
  run_captions: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-captions --input <audio_or_video> --output-prefix <srt_prefix>"
  run_rife: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-rife --input <clip> --output <clip>"
  run_comfy_workflow: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-comfy-workflow --capability <capability> --workflow-json <workflow>"

bridge_sync_commands:
  audit: "python3 tools/shadow_runtime/media_factory_bridge_sync.py --runtime-check"
  apply: "python3 tools/shadow_runtime/media_factory_bridge_sync.py --runtime-check --apply"
  rule: "Run audit after Media Factory changes. Run apply only after user-approved repo sync."

capability_truth:
  source_of_truth: /Users/apple/ShadowMediaFactory/control_panel/config/capability_map.json
  last_known_truth:
    local_image_broll_lane:
      engine: "FFmpeg local image/music/SFX assembly"
      readiness_status: PROVEN
      production_role: immediate_non_cinematic_broll
      output_classification: local_image_music_broll_mp4
      proof_json_required: true
      current_proof_path: /Users/apple/ShadowMediaFactory/control_panel/proofs/local_broll_test_proof.json
      supports_pan_zoom: true
      supports_audio_mix: true
      supports_hyperframes_overlay: false
      boundary: "Creates local image-based B-roll from approved stills/music/SFX; it does not generate new source images or replace DaVinci final finishing."
    local_animatic_lane:
      engine: "SD1.5 + Canny ControlNet + AnimateDiff"
      readiness_status: LOCAL_ENGINE_READY
      output_classification: animated_storyboard
      production_cinematic_ready: false
      supports_canny: true
      supports_openpose: false
      supports_depth: false
      supports_lineart: false
      supports_ipadapter: false
      supports_true_camera_motion: false
    wan_lane:
      engine: "Wan2.2 TI2V 5B"
      readiness_status: LOCAL_ENGINE_READY
      technical_pass: true
      production_quality_pass: false
      production_role: experimental
    assembly_lane:
      engine: FFmpeg
      readiness_status: LOCAL_ENGINE_READY
      supports_audio_mix: true
      supports_per_scene_sfx: false
      production_role: assembly_export
    davinci_lane:
      engine: DaVinci Resolve
      readiness_status: LOCAL_ENGINE_READY
      production_role: manual_finishing_qc
      automated_project_handoff_proven: false
    hyperframes_lane:
      engine: "HyperFrames Node.js CLI"
      readiness_status: PROVEN_FOR_NON_CINEMATIC_GRAPHICS
      production_role: html_css_deterministic_render
      supports_alpha_webm: false
      supports_alpha_mov: true
      overlay_alpha_export_status: PROVEN_MOV_ONLY
      alpha_family_name_compatibility: "webm_alpha_overlay family name retained; production-safe alpha output remains .mov only"
      fx_pack_status: PARTIAL_PROVEN
      hud_border_pack_status: PROVEN_TEMPLATE_EMBEDDED
      proof_json_required: true
      proof_parity_status: PASS
      current_proof_path: /Users/apple/ShadowMediaFactory/control_panel/proofs/hyperframes_render_20260613_124043.json
      current_proof_output: /Users/apple/ShadowMediaFactory/08_EXPORTS/review/hyperframes/pro_upgrade/alpha_overlay_production_safe.mov
      owning_subskills:
        - SS-116
        - SS-118
      supported_visual_methods:
        - NOTEBOOKLM_VISUAL_METHOD
        - PROGRAMMATIC_SLIDE_VISUAL_METHOD
        - HTML_CSS_GSAP_VISUAL_METHOD
        - A_ROLL_OVERLAY_METHOD
      supported_template_families:
        - playstation_dashboard_panel
        - notebooklm_dual_panel
        - image_evidence_wall
        - kinetic_principle_card
        - webm_alpha_overlay
      boundary: "HyperFrames renders deterministic HTML/CSS/GSAP slides and alpha overlays; current production-safe alpha delivery is .mov on this runtime. It does not replace DaVinci Resolve for 2.5D parallax or final assembly."
    notebooklm_panels_lane:
      engine: "HyperFrames template family: notebooklm_dual_panel"
      readiness_status: CONFIGURED_NEEDS_PROOF_RENDER
      production_role: clean_document_note_panel_broll
      proof_json_required: true
      boundary: "Simulates NotebookLM-style panels locally; it does not operate Google NotebookLM or claim NotebookLM cloud export."
    hyperframes_first_proof_packet_lane:
      engine: "HyperFrames CLI + FFmpeg support assembly"
      readiness_status: PACKET_READY
      production_role: multi_cut_non_cinematic_broll_proof
      proof_json_required: true
      overlay_alpha_requirement: mov_only_on_current_runtime
      overlay_alpha_output_blocked_extension: ".webm"
      supported_template_families:
        - playstation_dashboard_panel
        - notebooklm_dual_panel
        - image_evidence_wall
        - kinetic_principle_card
        - webm_alpha_overlay
      boundary: "This lane is approved for the next 30-second proof packet design. It must not silently downgrade to generic ffmpeg_ken_burns when a HyperFrames family is explicitly requested, and alpha-overlay scenes must use the proven .mov path."
    depth_anything_v2_lane:
      engine: "Depth Anything V2"
      readiness_status: LOCAL_ENGINE_READY
      default_encoder: "vits"
      default_model: "Depth-Anything-V2-Small"
      default_license: "Apache-2.0"
      supports_batch_images: true
      supports_single_image: true
      output_classification: depth_map_png
      davinci_dependency: true
      production_role: depth_map_generation
      owning_subskills:
        - SS-117
      supported_visual_methods:
        - IMAGE_MOTION_GRAPHICS_BROLL_METHOD
      boundary: "Depth Anything V2 is a local depth-mask generator only; DaVinci Resolve Fusion performs the 2.5D parallax composite."
    rife_lane:
      engine: "RIFE NCNN Vulkan"
      readiness_status: CALLABLE_OPTIONAL
      production_role: optional_smoothing_after_render
      proof_json_required: false
      boundary: "Optional interpolation/polish pass only; not a B-roll generator."
    comfyui_api_lane:
      engine: "ComfyUI local API"
      readiness_status: OFFLINE
      production_role: backlog_experimental_generation
      boundary: "Installed models may exist, but API readiness is false until ComfyUI is running and workflow proofs pass."

honesty_gate_policy:
  preflight_required_before_render: true
  block_production_pass_on_route_downgrade: true
  block_production_pass_on_missing_audio_when_requested: true
  block_production_pass_on_visual_quality_failure: true
  classify_sd15_canny_animatediff_as: animated_storyboard
  classify_wan_until_visual_recovery_as: experimental
  safe_to_batch_automate_cinematic_broll: false

drift_sync_policy:
  audit_required_after_media_factory_change: true
  auto_apply_without_user_approval: false
  apply_mode_updates_bridge_sync_state_only: true
  source_paths_checked:
    - /Users/apple/ShadowMediaFactory/control_panel/config/capability_map.json
    - /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py
    - /Users/apple/ShadowMediaFactory/control_panel/proofs
    - /Users/apple/ShadowMediaFactory/control_panel/registry
  repo_sync_command: "python3 tools/shadow_runtime/media_factory_bridge_sync.py --runtime-check --apply"

provider_boundary:
  n8n_used: false
  providers_called_by_default: false
  approved_paid_exceptions:
    - HeyGen
    - ElevenLabs
  new_paid_providers_require_approval: true
  local_engine_execution_requires_approval: true
  media_creation_claim_requires_proof: true

agent_operating_protocol:
  - "Load AGENTS.md and the MEDIA_FACTORY_HANDOFF route before Media Factory tasks."
  - "Load this bridge registry and runtime_contracts/LOCAL_MEDIA_FACTORY_BRIDGE_CONTRACT.md."
  - "Generate scene and prompt packets in ShadowCreatorOS_Lightweight."
  - "Place or reference handoff packets using the job_packet_dir_template."
  - "Run status/doctor/preflight before render execution when execution is approved."
  - "If preflight downgrades a request, report animated_storyboard or experimental honestly."
  - "Read Media Factory proof JSON and registry JSONL before claiming artifacts."
  - "Run the bridge sync audit after Media Factory runtime changes and apply sync state only with user-approved repo-write."
  - "Do not modify the Shadow repo from Media Factory execution unless the user explicitly approves repo-write."

