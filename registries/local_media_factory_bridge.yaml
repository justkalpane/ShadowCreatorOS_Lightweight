version: 1
registry_id: local_media_factory_bridge
updated_at: "2026-06-03"
owner: shadow_commander
purpose: >
  Permanent local bridge registry between ShadowCreatorOS_Lightweight and the
  deployed ShadowMediaFactory engine on the current Mac. Agents must use this
  registry before handing off visual drafts, storyboard packets, prompt packets,
  or render instructions to the local Media Factory.

path_authority:
  note: "Absolute paths are local Mac references, not portable repo law."
  shadow_creator_os_root: /Users/apple/Documents/ShadowCreatorOS_Lightweight
  local_media_factory_root: /Users/apple/ShadowMediaFactory
  local_mac_reference_only: true

runtime_paths:
  media_factory_root: /Users/apple/ShadowMediaFactory
  control_panel_root: /Users/apple/ShadowMediaFactory/control_panel
  control_panel_cli: /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py
  capability_map: /Users/apple/ShadowMediaFactory/control_panel/config/capability_map.json
  proofs_dir: /Users/apple/ShadowMediaFactory/control_panel/proofs
  registry_dir: /Users/apple/ShadowMediaFactory/control_panel/registry
  jobs_dir: /Users/apple/ShadowMediaFactory/control_panel/jobs
  logs_dir: /Users/apple/ShadowMediaFactory/control_panel/logs
  exports_dir: /Users/apple/ShadowMediaFactory/08_EXPORTS
  review_exports_dir: /Users/apple/ShadowMediaFactory/08_EXPORTS/review
  repo_outputs_dir: /Users/apple/ShadowMediaFactory/01_REPO_OUTPUTS
  inbox_dir: /Users/apple/ShadowMediaFactory/00_INBOX
  comfyui_root: /Users/apple/ShadowMediaFactory/apps/ComfyUI
  comfyui_input_dir: /Users/apple/ShadowMediaFactory/apps/ComfyUI/input
  comfyui_output_dir: /Users/apple/ShadowMediaFactory/apps/ComfyUI/output
  comfyui_api_url: http://127.0.0.1:8188
  default_storyboard_input_dir: /Users/apple/Downloads/b_roll_storyboard

handoff_contract:
  shadow_creator_os_role:
    - "Acts as the brain: research, script, scene plan, visual draft, prompt packet, and route decision."
    - "Writes media-aware packets only after the MEDIA_FACTORY_HANDOFF route is selected."
    - "Does not claim generated media unless the Media Factory returns proof artifacts."
  shadow_media_factory_role:
    - "Acts as the local media worker: preflight, local generation, assembly, proofs, registry, export."
    - "Executes only after explicit local-engine approval when execution is requested."
    - "Returns proof JSON and artifact paths back to the ShadowCreatorOS agent."
  job_packet_dir_template: /Users/apple/ShadowMediaFactory/control_panel/jobs/<job_id>/01_timeline
  expected_shadow_os_outputs:
    - prompt_packet.json
    - shotlist.json
    - scene_contract.json
    - video_pacing_metadata.json
    - video_pacing_metadata_notepad.txt
  media_factory_reads_from:
    - /Users/apple/ShadowMediaFactory/control_panel/jobs/<job_id>/01_timeline
    - /Users/apple/Downloads/b_roll_storyboard
    - /Users/apple/ShadowMediaFactory/00_INBOX
  media_factory_writes_to:
    - /Users/apple/ShadowMediaFactory/control_panel/proofs
    - /Users/apple/ShadowMediaFactory/control_panel/registry
    - /Users/apple/ShadowMediaFactory/08_EXPORTS

control_panel_commands:
  status: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py status"
  doctor: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py doctor"
  preflight_storyboard: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py preflight-storyboard --metadata <metadata_json>"
  local_broll_proof: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-local-broll-proof --profile youtube_16_9"
  run_animdiff: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-animdiff <args>"
  run_wan: "python3 /Users/apple/ShadowMediaFactory/control_panel/bin/shadow_factory_ctl.py run-wan <args>"

capability_truth:
  source_of_truth: /Users/apple/ShadowMediaFactory/control_panel/config/capability_map.json
  last_known_truth:
    local_animatic_lane:
      engine: "SD1.5 + Canny ControlNet + AnimateDiff"
      readiness_status: LOCAL_ENGINE_READY
      output_classification: animated_storyboard
      production_cinematic_ready: false
      supports_canny: true
      supports_openpose: false
      supports_depth: false
      supports_lineart: false
      supports_ipadapter: false
      supports_true_camera_motion: false
    wan_lane:
      engine: "Wan2.2 TI2V 5B"
      readiness_status: LOCAL_ENGINE_READY
      technical_pass: true
      production_quality_pass: false
      production_role: experimental
    assembly_lane:
      engine: FFmpeg
      readiness_status: LOCAL_ENGINE_READY
      supports_audio_mix: true
      supports_per_scene_sfx: false
      production_role: assembly_export
    davinci_lane:
      engine: DaVinci Resolve
      readiness_status: LOCAL_ENGINE_READY
      production_role: manual_finishing_qc
      automated_project_handoff_proven: false

honesty_gate_policy:
  preflight_required_before_render: true
  block_production_pass_on_route_downgrade: true
  block_production_pass_on_missing_audio_when_requested: true
  block_production_pass_on_visual_quality_failure: true
  classify_sd15_canny_animatediff_as: animated_storyboard
  classify_wan_until_visual_recovery_as: experimental
  safe_to_batch_automate_cinematic_broll: false

provider_boundary:
  n8n_used: false
  providers_called_by_default: false
  approved_paid_exceptions:
    - HeyGen
    - ElevenLabs
  new_paid_providers_require_approval: true
  local_engine_execution_requires_approval: true
  media_creation_claim_requires_proof: true

agent_operating_protocol:
  - "Load AGENTS.md and the MEDIA_FACTORY_HANDOFF route before Media Factory tasks."
  - "Load this bridge registry and runtime_contracts/LOCAL_MEDIA_FACTORY_BRIDGE_CONTRACT.md."
  - "Generate scene and prompt packets in ShadowCreatorOS_Lightweight."
  - "Place or reference handoff packets using the job_packet_dir_template."
  - "Run status/doctor/preflight before render execution when execution is approved."
  - "If preflight downgrades a request, report animated_storyboard or experimental honestly."
  - "Read Media Factory proof JSON and registry JSONL before claiming artifacts."
  - "Do not modify the Shadow repo from Media Factory execution unless the user explicitly approves repo-write."
