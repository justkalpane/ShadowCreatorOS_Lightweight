route_id: MEDIA_FACTORY_HANDOFF
route_name: Media Factory Handoff
trigger_terms: [storyboard, B-roll plan, scene prompt packet, scene-level visual plan, image prompt packet, video prompt packet, Media Factory, local engine handoff, local media generation, pacing metadata, video frame by frame, cinematic storyboard, shot list with prompts, visual storyboard, render packet, local render, ComfyUI, AnimateDiff, FFmpeg, DaVinci]
mandatory_startup_docs: [AGENTS.md, START_HERE_FOR_AGENTS.md, AGENT_READ_ORDER.md, AGENT_REPO_FIRST_OPERATING_DOCTRINE.md, AGENT_ANTI_DRIFT_RULES.md]
mandatory_runtime_contracts: [runtime_contracts/TASK_INTENT_ROUTING_CONTRACT.md, runtime_contracts/ROUTE_DEPENDENCY_EXPANSION_PROTOCOL.md, runtime_contracts/TASK_EXECUTION_STATE_MACHINE_CONTRACT.md, runtime_contracts/DIRECTOR_SKILL_CONSUMPTION_PROTOCOL.md, runtime_contracts/MEDIA_FACTORY_FINAL_DRAFT_CONTRACT.md, runtime_contracts/LOCAL_CLOUD_HYBRID_MEDIA_EXECUTION_CONTRACT.md, runtime_contracts/DYNAMIC_TIMED_BEAT_MAP_CONTRACT.md, runtime_contracts/PROVIDER_HANDOFF_CONTRACT.md, runtime_contracts/CONTENT_ENGINEERING_OUTPUT_CONTRACT.md, runtime_contracts/QUALITY_GATE_CONTRACT.md]
