mandatory_output_blocks: [TASK_ROUTE_LOCK, ROUTE_DEPENDENCY_EXPANSION_LOCK, CONSUMPTION_LOCK, MEDIA_FACTORY_SYNC_LOCK, GOVERNANCE_LOCK, SCENE_SYNC_MATRIX, SCENE_PROMPT_PACKETS, VIDEO_PROMPT_PACKETS, STORYBOARD_EXPORT_PLAN, LOCAL_MEDIA_FACTORY_BRIDGE_STATUS, PROVIDER_HONESTY_GATE]
required_locks: [TASK_ROUTE_LOCK, ROUTE_DEPENDENCY_EXPANSION_LOCK, CONSUMPTION_LOCK, MEDIA_FACTORY_SYNC_LOCK, GOVERNANCE_LOCK]
freshness_gate_required_when: [latest, current, new model, 2026]
provider_boundary_required_when: [always]
chat_only_allowed: true
repo_write_allowed_after_approval: true
full_dossier_allowed_after_explicit_request: true
n8n_allowed_after_approval: false
provider_execution_allowed_after_approval: false
local_engine_execution_allowed_after_approval: true
fail_rules: [scene prompt packet missing visual DNA field, SCENE_SYNC_MATRIX missing or contains only headings, media artifact claimed without evidence block, provider execution claimed without approval, local engine execution claimed without render metadata, tool_specific_translation_readiness below PACKET_READY for claimed execution]
partial_rules: [local engine readiness is DESIGNED or STUB but disclosed, storyboard export plan present but images not yet generated, pacing metadata present but video not yet rendered]
pass_rules: [all scene prompt packets include complete 15-field visual DNA, SCENE_SYNC_MATRIX emits one scene_row_json per scene, LOCAL_MEDIA_FACTORY_BRIDGE_STATUS declares readiness per engine per lane, PROVIDER_HONESTY_GATE is explicit with no fake claims, storyboard export references exact filenames in pacing metadata]
create_missing_registry_binding: false

# Route Trigger Aliases
trigger_aliases:
  - "Shadow storyboard:"
  - "Shadow visual plan:"
  - "Shadow scene prompt:"
  - "Shadow Media Factory:"
  - "Shadow render packet:"
  - "Shadow B-roll:"

# Mandatory Contracts (explicit list)
mandatory_contracts:
  - runtime_contracts/TASK_INTENT_ROUTING_CONTRACT.md
  - runtime_contracts/ROUTE_DEPENDENCY_EXPANSION_PROTOCOL.md
  - runtime_contracts/TASK_EXECUTION_STATE_MACHINE_CONTRACT.md
  - runtime_contracts/DIRECTOR_SKILL_CONSUMPTION_PROTOCOL.md
  - runtime_contracts/MEDIA_FACTORY_FINAL_DRAFT_CONTRACT.md
  - runtime_contracts/LOCAL_CLOUD_HYBRID_MEDIA_EXECUTION_CONTRACT.md
  - runtime_contracts/DYNAMIC_TIMED_BEAT_MAP_CONTRACT.md
  - runtime_contracts/PROVIDER_HANDOFF_CONTRACT.md
  - runtime_contracts/CONTENT_ENGINEERING_OUTPUT_CONTRACT.md
  - runtime_contracts/QUALITY_GATE_CONTRACT.md

# Output Blocks (explicit list)
output_blocks:
  - TASK_ROUTE_LOCK
  - ROUTE_DEPENDENCY_EXPANSION_LOCK
  - CONSUMPTION_LOCK
  - MEDIA_FACTORY_SYNC_LOCK
  - GOVERNANCE_LOCK
  - SCENE_SYNC_MATRIX
  - SCENE_PROMPT_PACKETS
  - VIDEO_PROMPT_PACKETS
  - STORYBOARD_EXPORT_PLAN
  - LOCAL_MEDIA_FACTORY_BRIDGE_STATUS
  - PROVIDER_HONESTY_GATE

# Validator Binding
validator_binding:
  validator_file: validators/validate_script_generation_output.py
  required_checks:
    - shadow_command_alias_detected
    - route_manifest_loaded
    - provider_boundary_present
    - no_n8n_provider_media_execution
    - scene_sync_matrix_present
    - scene_sync_schema_validation_pass
    - media_factory_sync_lock_status
    - scene_sync_gate_status

# Provider Boundary
provider_boundary:
  required: true
  n8n_allowed_after_approval: false
  provider_execution_allowed_after_approval: false
  media_creation_allowed_after_approval: false
  local_engine_execution_allowed_after_approval: true
  local_engine_evidence_required_when_execution_claimed: true

# Status Limits
status_limits:
  full_pass_requires_validator_binding: true
  full_pass_requires_provider_boundary: true
  full_pass_requires_scene_row_json_per_scene: true
  full_pass_requires_visual_dna_all_fields: true
  documented_only_max_status: PARTIAL
  claimed_artifact_without_evidence_max_status: BLOCKED

# Onboarding Limits
onboarding_limits:
  safe_to_start_n8n: false
  safe_to_declare_lightweight_os_onboarded: false
  safe_to_claim_provider_execution: false
  safe_to_claim_local_engine_execution_without_evidence: false

# MAC-06.2B Route Depth Requirements
mac_06_2b_route_depth_requirements:
  required_component_contract_standard: runtime_contracts/UNIVERSAL_COMPONENT_CONTRACT_STANDARD.md
  required_communication_pointers: registries/communication_pointer_registry.yaml
  required_input_packets: [director_intent_packet, scene_brief_packet, script_segment_packet]
  required_output_packets: [scene_prompt_packet, video_prompt_packet, storyboard_export_packet, local_engine_bridge_packet, provider_handoff_packet, media_quality_gate_packet, lineage_approval_packet]
  required_media_packets:
    - runtime_contracts/media_packets/VISUAL_CONTEXT_PACKET_CONTRACT.md
    - runtime_contracts/media_packets/VIDEO_CONTEXT_PACKET_CONTRACT.md
    - runtime_contracts/media_packets/MUSIC_SFX_PACKET_CONTRACT.md
    - runtime_contracts/media_packets/EDITING_TIMELINE_PACKET_CONTRACT.md
    - runtime_contracts/media_packets/PROVIDER_HANDOFF_PACKET_CONTRACT.md
    - runtime_contracts/media_packets/MEDIA_QUALITY_GATE_PACKET_CONTRACT.md
    - runtime_contracts/media_packets/LINEAGE_APPROVAL_PACKET_CONTRACT.md
  required_schemas:
    - schemas/media_factory/scene_sync_matrix.schema.json
    - schemas/media_factory/scene_prompt_packet.schema.json
    - schemas/media_factory/media_factory_packet.schema.json
  required_quality_gates: [visual_dna_compliance_score, tool_translation_readiness_score, media_quality_gate_packet, final_pass_fail]
  validator_binding: validators/validate_script_generation_output.py
  lineage_required: true
  provider_boundary: provider_execution_allowed=false unless explicitly approved
  fallback_routes: [BLOCKED_BEFORE_OUTPUT, NEEDS_HUMAN_REVIEW]
  human_approval_points: [provider_execution, n8n_execution, media_creation, repo_write, full_dossier, local_engine_execution]

# MAC-06.2D Article Pipeline Connections
mac_06_2d_article_pipeline_connections:
  visual_scene_prompts: runtime_contracts/media_packets/VISUAL_CONTEXT_PACKET_CONTRACT.md
  video_motion_prompts: runtime_contracts/media_packets/VIDEO_CONTEXT_PACKET_CONTRACT.md
  storyboard_export_plan: schemas/media_factory/scene_prompt_packet.schema.json
  local_engine_bridge_status: runtime_contracts/LOCAL_CLOUD_HYBRID_MEDIA_EXECUTION_CONTRACT.md
  pacing_metadata_coupling: runtime_contracts/DYNAMIC_TIMED_BEAT_MAP_CONTRACT.md
  media_factory_packet_schema: schemas/media_factory/media_factory_packet.schema.json
  provider_honesty_gate: runtime_contracts/PROVIDER_HANDOFF_CONTRACT.md
  scene_sync_matrix_schema: schemas/media_factory/scene_sync_matrix.schema.json
  visual_dna_compliance: runtime_contracts/MEDIA_FACTORY_FINAL_DRAFT_CONTRACT.md
  provider_execution_enabled: false
