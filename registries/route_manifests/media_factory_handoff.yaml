mandatory_directors: [directors/production/maya.md, directors/production/vishwakarma.md, directors/cinematic/nataraja.md, directors/supreme_vision/brahma.md, directors/cinematic/varuna.md]
mandatory_agents: [agents/vishwakarma/vishwakarma_agent.py, agents/nataraja/nataraja_agent.py, agents/brahma/brahma_agent.py, agents/varuna/varuna_agent.py]
mandatory_subagents: [subagents/wf_400/wf_400_sub_agent.py, subagents/cwf_410/cwf_410_sub_agent.py, subagents/cwf_420/cwf_420_sub_agent.py]
mandatory_skills: [skills/media_video/M-216-shot-list-generator.skill.md, skills/media_video/M-217-b-roll-sourcing-strategy.skill.md, skills/media_video/M-221-motion-graphics-storyboard.skill.md, skills/media_production/A-402-visual-asset-planner.skill.md, skills/media_production/A-401-thumbnail-concept-designer.skill.md, skills/operations/M-174-visual-asset-generator.skill.md]
mandatory_subskills: [skills/sub_skills/SS-103-nanobanana-visual-generation-optimizer.subskill.md, skills/sub_skills/SS-104-sora-video-generation-orchestrator.subskill.md, skills/sub_skills/SS-105-higgsfield-cinematic-motion-director.subskill.md, skills/sub_skills/SS-106-kling-video-prompt-optimizer.subskill.md, skills/sub_skills/SS-112-ffmpeg-render-assembly-guard.subskill.md]
